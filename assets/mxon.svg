<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Motocross of Nations weekend graphic">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1a3a"/>
    <stop offset="0.55" stop-color="#1a2a6c"/>
    <stop offset="1" stop-color="#b22234"/>
  </linearGradient>
  <pattern id="hash" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
    <rect width="8" height="20" fill="#fff" opacity=".05"/>
  </pattern>
</defs>
<rect width="800" height="160" fill="url(#sky)"/>
<rect width="800" height="160" fill="url(#hash)"/>
<!-- France-inspired bands (abstract, not a flag copy) -->
<rect x="0" y="0" width="18" height="160" fill="#002395"/>
<rect x="18" y="0" width="18" height="160" fill="#fff" opacity=".9"/>
<rect x="36" y="0" width="18" height="160" fill="#ed2939"/>
<!-- USA-inspired accent stripe -->
<rect x="764" y="0" width="12" height="160" fill="#b22234"/>
<rect x="776" y="0" width="12" height="160" fill="#fff" opacity=".85"/>
<rect x="788" y="0" width="12" height="160" fill="#3c3b6e"/>
<!-- Track swoosh -->
<path d="M80 120 C 220 40, 360 140, 500 70 S 700 40, 760 95" fill="none" stroke="#ffc400" stroke-width="8" stroke-linecap="round" opacity=".9"/>
<path d="M80 120 C 220 40, 360 140, 500 70 S 700 40, 760 95" fill="none" stroke="#ff6a00" stroke-width="3" stroke-linecap="round" opacity=".85"/>
<!-- Gate start bars -->
<g fill="#ffc400">
  <rect x="110" y="28" width="10" height="70" rx="2"/>
  <rect x="128" y="28" width="10" height="70" rx="2"/>
  <rect x="146" y="28" width="10" height="70" rx="2"/>
  <rect x="104" y="22" width="58" height="8" rx="2"/>
</g>
<text x="190" y="58" font-family="Arial Black,Impact,sans-serif" font-size="28" font-style="italic" font-weight="900" fill="#fff" letter-spacing="2">MXoN</text>
<text x="190" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffc400">ERNÉE · OCT 2–4</text>
<text x="190" y="112" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d0d4e0">TEAM USA · HOST FRANCE</text>
</svg>
